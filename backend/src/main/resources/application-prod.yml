spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  sql:
    init:
      mode: never

langchain4j:
  open-ai:
    chat-model:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model-name: ${AI_MODEL:glm-5.2}
      temperature: ${AI_TEMPERATURE:0.1}
      # 为结构化 JSON 回复预留足够空间，避免在闭合括号前被截断。
      max-tokens: ${AI_MAX_TOKENS:1200}
      timeout: ${AI_TIMEOUT:20s}
      max-retries: 1
      log-requests: false
      log-responses: false

server:
  error:
    include-message: never
    include-stacktrace: never

supportops:
  jwt:
    secret: ${JWT_SECRET}
