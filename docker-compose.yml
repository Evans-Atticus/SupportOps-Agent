services:
  mysql:
    image: mysql:8.0.42
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: supportops
      MYSQL_USER: ${DB_USERNAME:-supportops}
      MYSQL_PASSWORD: ${DB_PASSWORD:-supportops_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-supportops_root_dev}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - supportops_mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./backend/sql/portal-schema.sql:/docker-entrypoint-initdb.d/03-portal-schema.sql:ro
      - ./backend/sql/portal-data.sql:/docker-entrypoint-initdb.d/04-portal-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/supportops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-supportops}
      DB_PASSWORD: ${DB_PASSWORD:-supportops_dev}
      JWT_SECRET: ${JWT_SECRET:-replace-this-local-compose-secret-before-public-deployment}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4173,http://localhost:8088}
      AI_MODE: ${AI_MODE:-mock}
      AI_API_KEY: ${AI_API_KEY:-mock-not-used}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_MODEL: ${AI_MODEL:-glm-5.2}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.1}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1200}
      AI_TIMEOUT: ${AI_TIMEOUT:-20s}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8088}:80"

volumes:
  supportops_mysql_data:
